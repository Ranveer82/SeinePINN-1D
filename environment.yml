name: seinepinn_1d
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytorch>=2.2
  - pytorch-cuda=12.1      # match your CUDA version, or remove this line for CPU only
  - numpy>=1.23
  - pandas>=2.0
  - pyyaml>=6.0
  # optional: tools/raster_to_transects.py (bathymetry from a DEM)
  - rasterio>=1.3
  - scipy>=1.9
  # optional: tests
  - pytest
  - pip:
    - -e .
