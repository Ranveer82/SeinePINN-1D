[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seinepinn_1d"
version = "1.0.0"
description = "Hybrid LSTM physics-informed neural network (PINN) for the 1-D Saint-Venant equations of a tidal river: stage, velocity and discharge."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ranveer Kumar"},
    {name = "Pierre-Yann David"},
]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.2",
    "numpy>=1.23",
    "pandas>=2.0",
    "PyYAML>=6.0",
]
keywords = ["physics-informed neural network", "Saint-Venant", "tidal river",
            "estuary", "hydrodynamics", "LSTM", "Seine"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# tools/raster_to_transects.py (bathymetry from a DEM)
geometry = ["rasterio>=1.3", "scipy>=1.9"]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/Ranveer82/SeinePINN/tree/SeinePINN_1D"

[tool.setuptools]
packages = ["seinepinn_1d"]
